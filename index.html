<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Watch: Emergency Response</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            box-sizing: border-box;
            font-family: monospace;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
        }
        #fullscreen-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
        #system-status-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        .system-status-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s, color 0.2s;
            opacity: 0.8;
            color: #ffffff;
        }
        .system-status-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
        .system-status-btn.active {
            color: #00ff00;
            opacity: 1.0;
        }
        /* Loading Screen Overlay with Background Image */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('loading-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease-out;
            color: #ffffff;
            font-family: monospace;
        }
        /* Optional dark overlay to make text/progress bar stand out against the background */
        #loading-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        /* Ensure loading elements sit above the dark overlay */
        #loading-screen > * {
            position: relative;
            z-index: 2;
        }
        .loading-title {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        .loading-subtitle {
            font-size: 36px;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .progress-bar-container {
            width: 320px;
            height: 6px;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #9ca3af, #ffffff);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 10px #ffffff;
        }
        #loading-status {
            margin-top: 15px;
            font-size: 13px;
            color: #f3f4f6;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
    </style>
    <!-- Import map for Three.js and addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Loading Screen Overlay -->
    <div id="loading-screen">
        <div class="loading-title">Wind Watch</div>
        <div class="loading-subtitle">Emergency Response</div>
        <div class="progress-bar-container">
            <div id="loading-progress"></div>
        </div>
        <div id="loading-status">Initializing systems...</div>
    </div>

    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 10L3 3"></path>
            <path d="M3 9V3h6"></path>
            <path d="M14 10l7-7"></path>
            <path d="M15 3h6v6"></path>
            <path d="M10 14l-7 7"></path>
            <path d="M3 15v6h6"></path>
            <path d="M14 14l7 7"></path>
            <path d="M21 15v6h-6"></path>
        </svg>
    </button>

    <!-- System Status Icons Container (Bottom Centre) -->
    <div id="system-status-container">
        <!-- Battery / Electrical [Q] -->
        <button id="status-battery" class="system-status-btn" title="Electrical / Battery [Q]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="18" height="10" rx="2"></rect>
                <line x1="22" y1="10" x2="22" y2="14"></line>
                <line x1="6" y1="11" x2="6" y2="13"></line>
                <line x1="10" y1="11" x2="10" y2="13"></line>
                <line x1="14" y1="11" x2="14" y2="13"></line>
            </svg>
        </button>
        <!-- Fuel Pump [F] -->
        <button id="status-fuelpump" class="system-status-btn" title="Fuel Pump [F]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h10v13H3z"></path>
                <path d="M13 8l4-2v6l-4-2"></path>
                <path d="M17 12h2a2 2 0 0 1 2 2v5"></path>
            </svg>
        </button>
        <!-- Engine [E] (Dashboard Check Engine Icon) -->
        <button id="status-engine" class="system-status-btn" title="Engine [E]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3v3h6V3"></path>
                <path d="M4 8h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path>
                <path d="M6 18v3M18 18v3M2 12h2M20 12h2"></path>
            </svg>
        </button>
        <!-- Landing Gear [G] (Three Solid Dots) -->
        <button id="status-gear" class="system-status-btn" title="Landing Gear [G]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="6" r="2.5" fill="currentColor"></circle>
                <circle cx="7" cy="17" r="2.5" fill="currentColor"></circle>
                <circle cx="17" cy="17" r="2.5" fill="currentColor"></circle>
            </svg>
        </button>
        <!-- Landing Light [L] -->
        <button id="status-light" class="system-status-btn" title="Landing Light [L]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="M6.34 17.66l-1.41 1.41"></path>
                <path d="M19.07 4.93l-1.41 1.41"></path>
            </svg>
        </button>
    </div>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
